name: Release

# `pnpm release <version>` commits the version and tags it; pushing the tag starts this workflow.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write
  id-token: write

# A release runs to the end once started; a second push of the same tag waits for it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The folder of the package published to npm.
  PACKAGE_DIR: apps/api
  IMAGE: ghcr.io/spxis/rest-in-pieces

jobs:
  verify:
    name: Tag matches the version and changelog
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # This job installs nothing, so there is no pnpm for setup-node to find; v5 fails without this.
          package-manager-cache: false
      - name: Compare the tag with package.json and CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          declared="$(node -p 'require("./package.json").version')"
          if [ "$version" != "$declared" ]; then
            echo "::error title=Version mismatch::The tag $GITHUB_REF_NAME does not match package.json ($declared). Cut releases with pnpm release <version>."
            exit 1
          fi
          node scripts/release.ts --notes "$version" > /dev/null

  checks:
    name: Checks
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  # Each platform builds on a runner of its own kind (no QEMU emulation, which made arm64 the slow half),
  # pushes by digest only, and the image job below joins the digests into one tagged multi-platform image.
  image-build:
    name: Docker image (${{ matrix.platform }})
    needs: checks
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Name the platform for artifacts and caches
        run: echo "PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest
        with:
          images: ${{ env.IMAGE }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PAIR }}
      - name: Keep the digest for the image job
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  image:
    name: Docker image to GHCR
    needs: image-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE }}
          # The version without its v, and latest unless the version is a prerelease.
          tags: type=semver,pattern={{version}}
          flavor: latest=auto
      - name: Join the platform digests under the release tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          args=()
          while IFS= read -r tag; do args+=(-t "$tag"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          while IFS= read -r note; do args+=(--annotation "$note"); done < <(jq -r '.annotations[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for digest in *; do args+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${args[@]}"
      - name: Show the published image
        run: docker buildx imagetools inspect "$IMAGE:$DOCKER_METADATA_OUTPUT_VERSION"

  # Trusted publishing: there is no npm token anywhere. The package's settings on npmjs.com (Settings >
  # Trusted Publisher > GitHub Actions) name the one workflow allowed to publish it: organization or user
  # spxis, repository rest-in-pieces, workflow filename release.yml, environment name left empty. npm CLI
  # 11.5.1 or newer (Node 24 ships 11.x) then swaps this job's OIDC token (id-token: write) for a publish
  # credential by itself, as long as NODE_AUTH_TOKEN is not set. The first version of a package name is
  # published from the author's machine, because the package must exist before that setting can be made.
  npm:
    name: Package to npm
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # No separate build step: `npm publish` runs the package's `prepack` script, which builds the playground
      # (the `web` folder the package ships) and then dist/. pnpm is on PATH for that script from pnpm/action-setup.
      - name: Publish
        working-directory: ${{ env.PACKAGE_DIR }}
        # npm itself publishes, not pnpm: the OIDC exchange is npm's, and npm's docs describe only npm.
        # Provenance is automatic for a public repository over OIDC; --provenance is kept so a publish that
        # could not attach it fails instead of going out without. --access public is for the scoped name.
        run: npm publish --provenance --access public

  release:
    name: GitHub release
    needs: [image, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # This job installs nothing, so there is no pnpm for setup-node to find; v5 fails without this.
          package-manager-cache: false
      - name: Create the release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$RUNNER_TEMP/notes.md"
          node scripts/release.ts --notes "$version" > "$notes"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # A rerun after a failed job: refresh the notes rather than failing.
            gh release edit "$GITHUB_REF_NAME" --title "$version" --notes-file "$notes"
          else
            prerelease=()
            case "$version" in *-*) prerelease=(--prerelease) ;; esac
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$version" --notes-file "$notes" "${prerelease[@]}"
          fi
