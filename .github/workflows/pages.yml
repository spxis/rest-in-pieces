name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one but never cancels a deployment in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the in-browser playground
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/configure-pages@v5
        id: pages
      # The top bar shows the version and the short commit SHA. vite.config.ts reads the SHA from GITHUB_SHA, which the
      # runner sets on every step to the commit being built, and falls back to `git rev-parse --short HEAD`.
      # PAGES_URL is the site's full address, which fixtures/index.json lists every fixture at.
      - run: pnpm --filter @rest-in-pieces/web build:pages
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}/
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist-pages

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
