<text x="28" y="40" fill="#c9f36a" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="600">REST in Pieces</text>
<text x="28" y="76" fill="#f1f6f2" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="27" font-weight="700">A repeatable fake backend for your frontend</text>
<text x="28" y="102" fill="#9fb0a4" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14">Same seed, same people on every machine. Slow, flaky or messy whenever you ask.</text>
